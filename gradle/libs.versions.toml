[versions]
# === Build Tools & Languages ===
agp = "8.13.0"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
kotlinx-serialization = "1.9.0"

# === Core Android & KTX ===
core-ktx = "1.17.0"
lifecycle-runtime-ktx = "2.9.4"
splash = "1.0.1"
browser = "1.9.0"

# === UI (Compose & View) ===
activity-compose = "1.11.0"
compose-bom = "2025.10.01"
lifecycle-compose = "2.9.4"
material-icons = "1.7.8"
palette = "1.0.0"
constraintlayout = "1.1.1"

# === Navigation & Paging ===
navigation = "2.9.5"
paging = "3.3.6"

# === Networking & Image Loading ===
coil = "2.7.0"
retrofit = "3.0.0"
okhttp-logging = "5.2.1"

# === State Management & Utilities ===
koin-compose = "4.1.1"
timber = "5.0.1"

# === Persistence (Database) ===
room = "2.8.3"

# === Animation ===
lottie = "6.7.0"

# === Testing ===
junit = "4.13.2"
junit-ext = "1.3.0"
espresso-core = "3.7.0"

# === Firebase & Google Services ===
google-services = "4.4.4"
firebase-bom = "34.5.0"
firebase-crashlytics-plugin = "3.0.6"
firebase-appdistribution-plugin = "5.2.0"

[libraries]
# === Core Android & KTX ===
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
splash-screen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash" }
browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# === Jetpack Compose (UI & Foundation) ===
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
material3 = { group = "androidx.compose.material3", name = "material3" }
material-icons = { group = "androidx.compose.material", name = "material-icons-extended-android", version.ref = "material-icons" }
palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintlayout" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
lottie = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }

# === Compose Lifecycle, Navigation & Paging ===
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-compose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle-compose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# === Networking & Serialization ===
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp-logging" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# === Persistence (Room) ===
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# === Dependency Injection & Utilities ===
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin-compose" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# === Firebase ===
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# === Testing ===
junit4 = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics-plugin = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
firebase-appdistribution-plugin = { id = "com.google.firebase.appdistribution", version.ref = "firebase-appdistribution-plugin" }

[bundles]
compose-base = [
    "lifecycle-viewmodel-compose",
    "lifecycle-runtime-compose",
    "navigation-compose",
    "koin-compose",
    "constraintlayout-compose"
]

compose-ui = [
    "ui",
    "ui-graphics",
    "material3",
    "material-icons",
    "activity-compose"
]

paging = [
    "paging-compose",
    "paging-runtime"
]

room = [
    "room-runtime",
    "room-ktx"
]

utilities = [
    "timber",
    "palette",
    "splash-screen",
    "browser",
    "coil",
    "lottie"
]

android-test = [
    "junit-ext",
    "espresso-core"
]

compose-test = [
    "ui-test-junit4",
    "ui-test-manifest",
]

networking = [
    "retrofit",
    "retrofit-serialization",
    "okhttp-logging",
    "kotlinx-serialization"
]