name: TMDbBuild

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag (for example, v1.0.11)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git check-ref-format "$tag_ref"; then
            echo "::error::Enter a valid Git tag for the release."
            exit 1
          fi

          if git ls-remote --exit-code --tags --refs origin "$tag_ref" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$tag_ref"
            tagged_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::The release tag points to a different commit than the selected ref."
              exit 1
            fi
          elif [[ $? -ne 2 ]]; then
            echo "::error::Could not verify the release tag on origin."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Set Secret Properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: echo "$LOCAL_PROPERTIES" > ./local.properties

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'tmdb_keystore.jks'
          fileDir: './app/keystore/'
          encodedString: ${{ secrets.TMDB_KEYSTORE }}

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Build Release
        run: ./gradlew assembleRelease

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: TMDb Release ${{ inputs.release_tag }}
          tag: ${{ inputs.release_tag }}
          commit: ${{ github.sha }}
          token: ${{ secrets.MY_TOKEN }}
          artifacts: "app/build/outputs/apk/release/TMDb.apk"
          body: "Optimizing the app"

      - name: Upload Build Artifact
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: app/build/outputs/apk/release/TMDb.apk
